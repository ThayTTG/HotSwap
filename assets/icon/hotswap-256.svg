<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1E3D"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- stand -->
  <path d="M108 196 L148 196 L156 222 L100 222 Z" fill="url(#stand)"/>
  <rect x="72" y="218" width="112" height="16" rx="8" fill="url(#stand)"/>
  <!-- body -->
  <rect x="16" y="28" width="224" height="172" rx="24" fill="url(#body)"/>
  <!-- top highlight -->
  <rect x="17" y="29" width="222" height="170" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <!-- screen -->
  <rect x="32" y="44" width="192" height="140" rx="12" fill="url(#screen)"/>
  <rect x="32" y="44" width="192" height="140" rx="12" fill="url(#glow)"/>
  <!-- up arrow (left) -->
  <path d="M98 58 L132 96 L110 96 L110 156 L86 156 L86 96 L64 96 Z" fill="url(#up)" stroke-linejoin="round"/>
  <!-- down arrow (right) -->
  <path d="M158 170 L192 132 L170 132 L170 72 L146 72 L146 132 L124 132 Z" fill="url(#down)"/>
</svg>
