name: Build e Release

# Lança uma versão nova do HotSwap.
#
# Como disparar:
#   • enviar qualquer commit para o branch "release"  → a tag vem do <Version> do HotSwap.csproj
#   • ou enviar uma tag no formato v1.2.3
#
# Se a versão já foi lançada, o workflow para logo no começo e pede para aumentar o <Version>.
# Para só testar se compila, sem lançar nada, existe o workflow "Verificar compilação".
on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Descobrir a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/HotSwap/HotSwap.csproj
          $v = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" } else { $tag = "v$v" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Conferir se a versão é nova
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error title=Versão já lançada::A versão $tag já existe. Aumente o <Version> no .csproj (ex.: 1.0.0 → 1.0.1) e envie de novo para o branch release."
            exit 1
          }
          Write-Host "A versão $tag é nova. Seguindo com o lançamento."
          exit 0

      - name: Notas da versão (CHANGELOG.md)
        id: notas
        shell: pwsh
        run: python .github/scripts/notas_da_versao.py ler "${{ steps.versao.outputs.tag }}" CHANGELOG.md

      - name: Restaurar dependências
        run: dotnet restore src/HotSwap/HotSwap.csproj

      - name: Publicar (win-x64, single file)
        run: >
          dotnet publish src/HotSwap/HotSwap.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Compactar em .zip
        shell: pwsh
        run: |
          # Nome fixo: é o que o site e o NokyLabs Launcher procuram em releases/latest
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish\* -DestinationPath "HotSwap-win-x64.zip"
          (Get-FileHash HotSwap-win-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii HotSwap-win-x64.zip.sha256

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: HotSwap ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            HotSwap-win-x64.zip
            HotSwap-win-x64.zip.sha256
          body: |
            ## HotSwap ${{ steps.versao.outputs.tag }}

            ### O que há de novo
            <!-- novidades -->
            ${{ steps.notas.outputs.texto }}
            <!-- /novidades -->

            Troque a resolução, a taxa de atualização e o conteúdo entre telas direto da bandeja do Windows.

            **Como instalar**
            1. Baixe o `HotSwap-win-x64.zip` abaixo (ou instale pelo NokyLabs Launcher)
            2. Extraia em uma pasta permanente e abra o `HotSwap.exe`
            3. Se aparecer o aviso azul do Windows, clique em "Mais informações" › "Executar assim mesmo"

            **Requisitos:** Windows 10 ou 11 (64 bits). Não precisa instalar o .NET.

            Mais detalhes: https://thayttg.github.io/nokylabs/#hotswap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Se as notas vieram da seção "Não lançado", ela vira a seção desta versão no CHANGELOG do main.
      - name: Registrar a versão no CHANGELOG
        if: steps.notas.outputs.promover == 'sim'
        shell: bash
        env:
          PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth 1 origin "$PRINCIPAL"
          git checkout -f -B registrar-changelog "origin/$PRINCIPAL"
          python .github/scripts/notas_da_versao.py promover "${{ steps.versao.outputs.tag }}" CHANGELOG.md
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "CHANGELOG: versão ${{ steps.versao.outputs.tag }}"
          git push origin "HEAD:$PRINCIPAL" || echo "::warning::Não consegui registrar a versão no CHANGELOG; ajuste à mão."
